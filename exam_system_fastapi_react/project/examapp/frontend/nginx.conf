server {
    listen 5050;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # توجيه طلبات الـ API نحو حاوية الباك اند (FastAPI) داخل شبكة Docker
    location /api/ {
        proxy_pass http://backend:5051/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:5051/uploads/;
        proxy_set_header Host $host;
    }

    # دعم توجيه React Router من جهة العميل (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
